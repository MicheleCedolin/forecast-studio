# Builds the standalone Windows package on GitHub's own Windows machine and attaches the zip to the release.
# Use: create a release on GitHub (tag vX.Y.Z) and press "Publish release" without attaching anything; after about
# 10-15 minutes ForecastStudio-X.Y.Z-win64.zip appears under the release's Assets.
# "Run workflow" (Actions tab) builds the zip without a release and keeps it as a downloadable workflow artifact.
name: Windows package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write          # needed to attach the zip to the release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt

      - name: Install build requirements (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Quick tests (engine, new methods, R reference fixtures)
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_py_engine.py tests/test_benchmarks_metrics_ranking.py tests/test_golden_m4_benchmarks.py

      - name: Build with PyInstaller
        working-directory: packaging
        run: pyinstaller forecast_studio.spec --noconfirm --distpath ../dist --workpath ../build

      - name: Smoke test the executable
        run: |
          python packaging/make_dist.py --dist dist/ForecastStudio --version "${{ github.event.release.tag_name || 'dev' }}" --out dist
          dist/ForecastStudio/ForecastStudio.exe run --file dist/ForecastStudio/examples/nn5_weekly.tsf --method theta --out "$env:RUNNER_TEMP/smoke"
          if ($LASTEXITCODE -ne 0) { throw "smoke run failed" }

      - name: Package (README, example data, zip)
        run: python packaging/make_dist.py --dist dist/ForecastStudio --version "${{ github.event.release.tag_name || 'dev' }}" --out dist

      - name: Attach the zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem dist/ForecastStudio-*-win64.zip).FullName (Get-ChildItem dist/ForecastStudio-*-win64.zip.sha256).FullName --clobber

      - name: Keep the zip as a workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ForecastStudio-win64
          path: |
            dist/ForecastStudio-*-win64.zip
            dist/ForecastStudio-*-win64.zip.sha256
          retention-days: 14
