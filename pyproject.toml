[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsfstudio"
version = "0.1.1"
description = "Forecast Studio: TSF veri kümeleri üzerinde tahmin modellerini seçip çalıştıran ve hata/analiz çıktısı üreten uygulama"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "openpyxl>=3.1",
  "xlsxwriter>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Python motorunun isteğe bağlı yöntemleri: statsforecast modelleri ve global CatBoost. scikit-learn: statsforecast'ın MFLES
# modeli (auto_mfles) onu gerektirir ama kendi bağımlılıklarında bildirmez (kullanıcı makinesinde ImportError ile görüldü).
pyengine = ["statsforecast>=2.0", "catboost>=1.2", "scikit-learn>=1.3"]
# Derin modeller (PyTorch GluonTS)
deep = ["torch>=2.2", "gluonts[torch]>=0.17"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tsfstudio = ["data/*.yaml", "r/*.R", "r/lib/*.R", "app/static/*", "app/static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
